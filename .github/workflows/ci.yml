name: CI

# Lightweight checks on every PR and on pushes to main.
# Runs static analysis and the test suite. Codegen (freezed /
# json_serializable) must run before either, or analyze/test will
# fail on missing *.g.dart / *.freezed.dart files.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # site/privacy-policy.html is generated from docs/play-store/privacy-policy.md.
      # Fail if someone edited one without regenerating the other.
      - name: Privacy policy page is in sync with its markdown source
        run: dart run tool/build_privacy_policy.dart --check

      - name: Test
        run: flutter test
