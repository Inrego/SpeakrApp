name: Release

# Tag-driven releases: pushing a tag like `v1.2.3` builds and publishes
# version 1.2.3 (build-name = tag without the leading `v`). A manual
# workflow_dispatch builds the same artifacts using the pubspec `version:`
# field for the build-name, but does NOT create a GitHub Release.
#
# In all cases:
#   build-name   = X.Y.Z   (tag without `v`, or pubspec version on dispatch)
#   build-number = github.run_number
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Avoid two releases racing on the same tag/ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed by the release job to create a GitHub Release

jobs:
  # ---------------------------------------------------------------------------
  # Derive the version string and build number once, expose them as outputs so
  # every downstream build uses identical values.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      run_number: ${{ steps.resolve.outputs.run_number }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version & build number
        id: resolve
        shell: bash
        run: |
          RUN_NUMBER="${{ github.run_number }}"
          # Only a *tag push* publishes a GitHub Release. A workflow_dispatch
          # — even one launched from a tag ref — must NOT create a Release, so
          # gate on the event name as well as the ref type.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push: strip leading `v` from e.g. refs/tags/v1.2.3 -> 1.2.3
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            IS_RELEASE="true"
          else
            # Manual dispatch: read the bare version from pubspec.yaml
            # (`version: 0.1.0+1` -> 0.1.0). Strip an optional +build suffix.
            VERSION="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)"
            IS_RELEASE="false"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not resolve a version string." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION build-number=$RUN_NUMBER is_release=$IS_RELEASE"

  # ---------------------------------------------------------------------------
  # Android: signed AAB (Play) + universal APK (direct download).
  # ---------------------------------------------------------------------------
  android:
    name: Android (AAB + APK)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RUN_NUMBER: ${{ needs.version.outputs.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # Guard: without the signing secrets the Gradle release build silently
      # falls back to the debug signing config (a locked decision that keeps
      # local dev working), so a CI run with missing secrets would publish a
      # debug-signed AAB/APK. Fail loudly here instead — see
      # docs/RELEASE_READINESS.md item (f).
      - name: Verify Android signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing="$missing $name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing Android signing secret(s):$missing. Refusing to build — the release build would be silently debug-signed." >&2
            exit 1
          fi
          echo "All Android signing secrets are present."

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle (AAB)
        run: flutter build appbundle --release --build-name=$VERSION --build-number=$RUN_NUMBER

      - name: Build universal APK
        run: flutter build apk --release --build-name=$VERSION --build-number=$RUN_NUMBER

      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/Speakr-$VERSION.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Speakr-$VERSION.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: Inno Setup installer + portable zip of the Release runner folder.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (installer + portable)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RUN_NUMBER: ${{ needs.version.outputs.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        shell: pwsh
        run: flutter build windows --release --build-name=$env:VERSION --build-number=$env:RUN_NUMBER

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=$env:VERSION" windows\installer\Speakr.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Installer is emitted next to the .iss (OutputBaseFilename = Speakr-Setup-<version>).
          Copy-Item "windows\installer\Output\Speakr-Setup-$env:VERSION.exe" "dist\Speakr-Setup-$env:VERSION.exe"
          # Portable zip = contents of the Release runner folder.
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Speakr-$env:VERSION-windows-x64.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: only on tag pushes. Pulls every artifact and attaches them to a
  # GitHub Release named for the tag. Manual dispatch builds skip this.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [version, android, windows]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Speakr v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/android/*
            artifacts/windows/*
