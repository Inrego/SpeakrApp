org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation to dodge a Kotlin compiler bug
# that fires when the project root and the pub cache live on different
# drives (E:\ project vs C:\Users\...\Pub\Cache). The compiler can't
# compute relative paths across drive roots and the incremental cache
# writeback throws AssertionError at the end of compileKotlin tasks.
kotlin.incremental=false
